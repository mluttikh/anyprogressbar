[project]
name = "anyprogressbar"
version = "0.1.0.dev0"
description = "Progress bars for notebooks (an anywidget) and terminals, from one model"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mluttikh", email = "mluttikhof@gmail.com" }]
keywords = ["progress bar", "progress", "eta", "jupyter", "marimo", "anywidget", "terminal"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# none: scripts, CI jobs and libraries that only report progress install nothing else
dependencies = []

[project.optional-dependencies]
# the notebook widget (decision 0001): the install the README recommends
widget = ["anywidget>=0.9.13"]

[project.urls]
Homepage = "https://github.com/mluttikh/anyprogressbar"
Repository = "https://github.com/mluttikh/anyprogressbar"
Issues = "https://github.com/mluttikh/anyprogressbar/issues"
Changelog = "https://github.com/mluttikh/anyprogressbar/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.84",
    # the notebook renderers, run for real: a kernel through nbclient, and marimo
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "marimo>=0.20",
]

[build-system]
# hatchling 1.30+ writes Metadata-Version 2.5, which PyPI and twine 6 do not accept yet
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyprogressbar"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_scratch"]  # personal experiments

[tool.ruff.format]
exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "ANN",
    "C4", "SIM", "PIE", "PERF", "FURB", "RUF",
    "PT", "PLE", "PLW", "ISC", "PGH", "T10", "T20", "PTH", "RSE", "FLY", "RET", "DTZ",
]
ignore = [
    "ANN401",  # Any is the honest type for metric values
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",
    "PT012",  # the block that raises is the bar's own `with` block: that is what is tested
]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.12"
