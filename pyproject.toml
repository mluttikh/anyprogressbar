[project]
name = "anyprogressbar"
version = "0.1.0.dev0"
description = "Progress bars for notebooks (an anywidget) and terminals, from one model"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mluttikh", email = "mluttikhof@gmail.com" }]
keywords = ["progress bar", "progress", "eta", "jupyter", "marimo", "anywidget", "terminal"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# none: scripts, CI jobs and libraries that only report progress install nothing else
dependencies = []

[project.optional-dependencies]
# the notebook widget (decision 0001): the install the README recommends
widget = ["anywidget>=0.9.13"]

[project.urls]
Homepage = "https://github.com/mluttikh/anyprogressbar"
Repository = "https://github.com/mluttikh/anyprogressbar"
Issues = "https://github.com/mluttikh/anyprogressbar/issues"
Changelog = "https://github.com/mluttikh/anyprogressbar/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.84",
    # the notebook renderers, run for real: a kernel through nbclient, and marimo
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "marimo>=0.20",
    "anywidget>=0.9.13",
    # notebooks are committed without outputs (`nbstripout --install`, once per clone)
    "nbstripout>=0.9.1",
    "zensical>=0.0.66",
    "mkdocstrings[python]>=1.0.6",
    "markdown-exec>=1.12.3",
    # the widget in a real JupyterLab, driven by the browser tests (js/test/browser)
    "jupyterlab>=4",
]

[build-system]
# hatchling 1.30+ writes Metadata-Version 2.5, which PyPI and twine 6 do not accept yet
requires = ["hatchling>=1.27,<1.30", "hatch-jupyter-builder>=0.9"]
build-backend = "hatchling.build"

[tool.hatch.build]
# the JavaScript bundle is built, not committed; include it anyway
artifacts = ["src/anyprogressbar/static/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/anyprogressbar"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "js", "tests", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["js/node_modules"]

# Builds js/ into src/anyprogressbar/static during wheel builds (needs Node.js; end users get
# the pre-built wheel). Skipped when the bundle already exists, e.g. after `npm run dev`.
[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "src/anyprogressbar/static/widget.js",
    "src/anyprogressbar/static/widget.css",
]
skip-if-exists = ["src/anyprogressbar/static/widget.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
path = "js"
build_cmd = "build"
npm = ["npm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_scratch"]  # personal experiments

[tool.ruff.format]
exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "ANN",
    "C4", "SIM", "PIE", "PERF", "FURB", "RUF",
    "PT", "PLE", "PLW", "ISC", "PGH", "T10", "T20", "PTH", "RSE", "FLY", "RET", "DTZ",
]
ignore = [
    "ANN401",  # Any is the honest type for metric values
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # tools that report on the command line
# notebooks read as a user would write them: no annotations, loop variables with real names
"examples/*" = ["ANN", "T20", "B007"]
# the marimo app the browser tests run: cells, like the examples
"js/test/browser/apps/*" = ["ANN"]
"tests/*" = [
    "ANN",
    "PT012",  # the block that raises is the bar's own `with` block: that is what is tested
    "T20",  # printing while bars are live is what some tests are about
]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.environment]
python-version = "3.12"
