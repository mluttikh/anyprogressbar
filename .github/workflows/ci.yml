# Checks on every push and pull request: lint, types and tests on Python 3.12 to 3.15,
# on Linux and Windows, with the widget's bundle built; the JavaScript's types and tests; and
# the documentation, built strictly, with the browser tests (Playwright: the widget in
# Chromium, Firefox and WebKit, then in a real JupyterLab and marimo, and the built pages).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.15"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build the JavaScript bundle
        run: npm ci && npm run build
        working-directory: js
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs:
    name: Documentation (strict build; the examples run) and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci && npm run build
        working-directory: js
      - run: uv sync
      - run: uv run python scripts/build_docs.py
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: js
      - name: Browser tests
        run: npx playwright test
        working-directory: js
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: js/test-results/
          retention-days: 7
