# User documentation (https://zensical.org). Build with: uv run python scripts/build_docs.py
# The pages are in docs/user/, organised as tutorials, how-to guides, reference and
# explanation (https://docs.divio.com/documentation-system/). Their examples run while
# building, on a clock that sleeping moves (scripts/docs_pictures.py), and the bars shown
# are what those runs drew.

[project]
site_name = "anyprogressbar"
site_description = "Progress bars for notebooks and terminals, from one model."
site_url = "https://mluttikh.github.io/anyprogressbar/"
repo_url = "https://github.com/mluttikh/anyprogressbar"
repo_name = "mluttikh/anyprogressbar"
copyright = "Copyright &copy; 2026 mluttikh · MIT licence"
docs_dir = "docs/user"
site_dir = "site"
# links to page.html, not page/: the built site also works opened from disk (file://)
use_directory_urls = false
extra_css = ["assets/anyprogressbar/widget.css", "stylesheets/extra.css"]
extra_javascript = ["assets/replay.js"]
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    "tutorials/index.md",
    { "Your first progress bar" = "tutorials/first-bar.md" },
    { "Progress from your own functions" = "tutorials/functions.md" },
  ] },
  { "How-to guides" = [
    "how-to/index.md",
    { "Install anyprogressbar" = "how-to/install.md" },
    { "Totals, units and positions" = "how-to/totals.md" },
    { "Show values beside the bar" = "how-to/values.md" },
    { "Bars inside bars, and threads" = "how-to/nested.md" },
    { "Failures, interruptions and skipped work" = "how-to/endings.md" },
    { "Print and log while bars run" = "how-to/print.md" },
    { "Choose where bars show" = "how-to/where.md" },
    { "Bars in Jupyter, VS Code and marimo" = "how-to/notebooks.md" },
    { "Write a renderer of your own" = "how-to/renderer.md" },
    { "Switch from tqdm" = "how-to/tqdm.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "progress" = "reference/progress.md" },
    { "Renderers" = "reference/renderers.md" },
    { "Snapshot and Status" = "reference/snapshot.md" },
    { "What a bar says" = "reference/text.md" },
    { "Environment variables" = "reference/environment.md" },
  ] },
  { "Explanation" = [
    "explanation/index.md",
    { "Why bars wait, round and go quiet" = "explanation/waiting.md" },
    { "One bar, many places to show it" = "explanation/renderers.md" },
    { "How the notebook bar keeps time" = "explanation/widget.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
# ```python exec="on" blocks run while building (markdown-exec): examples are real code
[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "python"
class = "python"
validator = "markdown_exec.validator"
format = "markdown_exec.formatter"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "list"
filters = "public"
heading_level = 2
merge_init_into_class = true
members_order = "source"
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
signature_crossrefs = true
